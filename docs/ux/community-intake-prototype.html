../../dist/community-intake.css"><header><span class="logo">l<span class="sun">ı</span>ft</span><select id="language" aria-label="Prototype language"><option value="my">မြန်မာ</option><option value="en">English</option></select></header><main><aside>LOCAL UI TEST — simulated responses only. Nothing is submitted to Lift. No personal information. Not a live service.</aside><div class="prototype-info"><h1>Fictional test question</h1><p>Family learning question for interface testing.</p></div><div id="intake"></div></main><script src="../../dist/community-intake-client.js"></script><script src="../../dist/community-intake-ui.js"></script><script>const copies={"en": {"send": "Send privately for review", "notice": "Sending is optional. Your question or experience goes to Lift’s private review storage. It is not published to the community board. A response is not guaranteed.", "adult": "I am 18 or older and am sending my own question or experience.", "consent": "I agree to send this text for private review. I have removed names, contact details, document numbers, exact addresses and identifying details about other people.", "ai": "Optional: allow an editor to share a redacted version with ZCode for AI-assisted review.", "aiHelp": "You can leave this unchecked. AI suggestions are a first pass and do not count as qualified legal or health review.", "retention": "Receipt access ends after 14 days. Scheduled cleanup removes expired records. Withdrawal removes the question text from the current record; provider backups and copies already shared are outside this page’s controls.", "receiptWarning": "Keep your receipt code private. Anyone with it can check a reply or withdraw this submission. There is no account recovery if you lose it.", "confirmSend": "Send my text privately", "sending": "Sending… Keep this page open.", "received": "Received for private review. This does not mean it has been checked, answered or published.", "receipt": "Your private receipt code", "saveReceipt": "Download my receipt", "copyReceipt": "Copy my receipt", "receiptMemory": "Your receipt is not saved automatically, even when plan saving is on. Copy or download it before leaving. Copies remain outside Lift.", "check": "Check my submission", "enterReceipt": "Enter your private receipt code", "checkAction": "Check status", "waiting": "Received. No approved reply is available yet.", "answered": "An approved private reply is available.", "withdraw": "Withdraw my submission", "withdrawExplain": "This removes the question text from the current private record and prevents normal retries from restoring it. It does not delete any separate public post or copies already shared.", "confirmWithdraw": "Withdraw this submission", "withdrawn": "This submission has been withdrawn.", "expired": "This receipt has expired.", "notFound": "No submission was found for this code. Check the code and try again.", "closed": "Private submissions are not open yet. You can still prepare, copy or share a draft yourself.", "unavailable": "The request could not be confirmed. Keep your receipt code and check status before sending again.", "rateLimited": "Too many requests from this connection. Please try again later.", "invalidReceipt": "Enter the complete 43-character receipt code.", "consentNeeded": "Confirm the two required choices before sending. AI review is optional.", "offline": "Private submissions and replies need internet access. Your draft tools can still be used offline.", "reply": "Your private reply", "noUrgent": "This service is not continuously monitored. Use a support service directly for urgent assistance."}, "my": {"send": "စိစစ်ရန် သီးသန့်ပို့ပါ", "notice": "ပေးပို့မည်၊ မပို့မည်ကို ရွေးချယ်နိုင်ပါသည်။ သင့်မေးခွန်း သို့မဟုတ် အတွေ့အကြုံကို Lift ၏ သီးသန့်စိစစ်ရေးသိမ်းဆည်းရာသို့ ပို့ပါသည်။ အသိုင်းအဝိုင်းစာမျက်နှာတွင် မထုတ်ဝေပါ။ ပြန်လည်ဖြေကြားမည်ဟု အာမမခံပါ။", "adult": "ကျွန်ုပ်သည် အသက် ၁၈ နှစ်နှင့်အထက်ဖြစ်ပြီး ကိုယ်ပိုင်မေးခွန်း သို့မဟုတ် အတွေ့အကြုံကို ပေးပို့နေပါသည်။", "consent": "ဤစာသားကို သီးသန့်စိစစ်ရန် ပေးပို့ခြင်းကို သဘောတူပါသည်။ အမည်များ၊ ဆက်သွယ်ရန်အချက်အလက်များ၊ စာရွက်စာတမ်းနံပါတ်များ၊ လိပ်စာအတိအကျနှင့် အခြားသူများကို ဖော်ထုတ်နိုင်သော အသေးစိတ်အချက်များကို ဖယ်ရှားပြီးပါပြီ။", "ai": "ရွေးချယ်နိုင်သည် — တည်းဖြတ်သူက ကိုယ်ရေးအချက်အလက်များ ဖယ်ရှားထားသော မိတ္တူကို ဉာဏ်ရည်တုအကူအညီဖြင့် စိစစ်ရန် ZCode ထံ မျှဝေခြင်းကို ခွင့်ပြုပါသည်။", "aiHelp": "ဤအကွက်ကို အမှန်မခြစ်ဘဲ ထားနိုင်ပါသည်။ ဉာဏ်ရည်တု၏ အကြံပြုချက်များသည် ကနဦးသုံးသပ်ချက်သာဖြစ်ပြီး အရည်အချင်းရှိသူ၏ ဥပဒေ သို့မဟုတ် ကျန်းမာရေးဆိုင်ရာ စိစစ်မှုအဖြစ် မသတ်မှတ်ပါ။", "retention": "လက်ခံကုဒ်ဖြင့် ဝင်ကြည့်နိုင်မှုသည် ၁၄ ရက်ကြာပြီးနောက် ကုန်ဆုံးပါသည်။ သတ်မှတ်အချိန်အလိုက် ရှင်းလင်းမှုက သက်တမ်းကုန်မှတ်တမ်းများကို ဖယ်ရှားပါသည်။ ပြန်ရုပ်သိမ်းခြင်းသည် လက်ရှိမှတ်တမ်းမှ မေးခွန်းစာသားကို ဖယ်ရှားပါသည်။ ဝန်ဆောင်မှုပေးသူ၏ အရန်မိတ္တူများနှင့် မျှဝေပြီးသော မိတ္တူများကို ဤစာမျက်နှာမှ ထိန်းချုပ်၍ မရပါ။", "receiptWarning": "သင့်လက်ခံကုဒ်ကို လျှို့ဝှက်ထားပါ။ ကုဒ်ရှိသူ မည်သူမဆို ပြန်စာကို ကြည့်နိုင်ပြီး ဤပေးပို့ချက်ကို ပြန်ရုပ်သိမ်းနိုင်ပါသည်။ ကုဒ်ပျောက်ဆုံးလျှင် အကောင့်မှတစ်ဆင့် ပြန်လည်ရယူနိုင်ခြင်း မရှိပါ။", "confirmSend": "ကျွန်ုပ်၏စာသားကို သီးသန့်ပို့ပါ", "sending": "ပေးပို့နေပါသည်… ဤစာမျက်နှာကို ဖွင့်ထားပါ။", "received": "သီးသန့်စိစစ်ရန် လက်ခံရရှိပါပြီ။ စစ်ဆေးပြီး၊ ဖြေကြားပြီး သို့မဟုတ် ထုတ်ဝေပြီးဟု မဆိုလိုပါ။", "receipt": "သင့်သီးသန့်လက်ခံကုဒ်", "saveReceipt": "ကျွန်ုပ်၏လက်ခံအထောက်အထားကို ဒေါင်းလုဒ်လုပ်ပါ", "copyReceipt": "ကျွန်ုပ်၏လက်ခံအထောက်အထားကို ကူးယူပါ", "receiptMemory": "အစီအစဉ်သိမ်းဆည်းမှု ဖွင့်ထားလျှင်လည်း သင့်လက်ခံအထောက်အထားကို အလိုအလျောက် မသိမ်းဆည်းပါ။ စာမျက်နှာမှ မထွက်မီ ကူးယူပါ သို့မဟုတ် ဒေါင်းလုဒ်လုပ်ပါ။ မိတ္တူများသည် Lift ပြင်ပတွင် ကျန်ရှိပါသည်။", "check": "ကျွန်ုပ်၏ပေးပို့ချက်ကို စစ်ဆေးပါ", "enterReceipt": "သင့်သီးသန့်လက်ခံကုဒ်ကို ထည့်ပါ", "checkAction": "အခြေအနေကို စစ်ဆေးပါ", "waiting": "လက်ခံရရှိပါပြီ။ အတည်ပြုပြီးသော ပြန်စာ မရှိသေးပါ။", "answered": "အတည်ပြုပြီးသော သီးသန့်ပြန်စာ ရှိပါသည်။", "withdraw": "ကျွန်ုပ်၏ပေးပို့ချက်ကို ပြန်ရုပ်သိမ်းပါ", "withdrawExplain": "ဤလုပ်ဆောင်ချက်သည် လက်ရှိသီးသန့်မှတ်တမ်းမှ မေးခွန်းစာသားကို ဖယ်ရှားပြီး ပုံမှန်ပြန်လည်ပေးပို့ကြိုးစားမှုများကြောင့် ထိုစာသား ပြန်ဝင်မလာစေရန် တားဆီးပါသည်။ သီးခြားထုတ်ဝေထားသော အများမြင်ပို့စ် သို့မဟုတ် မျှဝေပြီးသော မိတ္တူများကို မဖျက်ပါ။", "confirmWithdraw": "ဤပေးပို့ချက်ကို ပြန်ရုပ်သိမ်းပါ", "withdrawn": "ဤပေးပို့ချက်ကို ပြန်ရုပ်သိမ်းပြီးပါပြီ။", "expired": "ဤလက်ခံကုဒ်၏ သက်တမ်းကုန်သွားပါပြီ။", "notFound": "ဤကုဒ်အတွက် ပေးပို့ချက် မတွေ့ပါ။ ကုဒ်ကို စစ်ဆေးပြီး ထပ်ကြိုးစားပါ။", "closed": "သီးသန့်ပေးပို့ချက်များကို လက်မခံသေးပါ။ မူကြမ်းကို ကိုယ်တိုင်ပြင်ဆင်ခြင်း၊ ကူးယူခြင်း သို့မဟုတ် မျှဝေခြင်း ပြုလုပ်နိုင်ပါသေးသည်။", "unavailable": "တောင်းဆိုမှုကို အတည်မပြုနိုင်ပါ။ သင့်လက်ခံကုဒ်ကို သိမ်းထားပြီး ထပ်မပို့မီ အခြေအနေကို စစ်ဆေးပါ။", "rateLimited": "ဤချိတ်ဆက်မှုမှ တောင်းဆိုမှု များလွန်းနေပါသည်။ နောက်မှ ထပ်ကြိုးစားပါ။", "invalidReceipt": "စာလုံးရေ 43 လုံးပါသော လက်ခံကုဒ်အပြည့်အစုံကို ထည့်ပါ။", "consentNeeded": "မပို့မီ မဖြစ်မနေလိုအပ်သော ရွေးချယ်ချက်နှစ်ခုကို အတည်ပြုပါ။ ဉာဏ်ရည်တုဖြင့် စိစစ်မှုကို ရွေးချယ်နိုင်ပါသည်။", "offline": "သီးသန့်ပေးပို့ချက်များနှင့် ပြန်စာများအတွက် အင်တာနက်ချိတ်ဆက်မှု လိုအပ်ပါသည်။ မူကြမ်းပြင်ဆင်ရေးကိရိယာများကို အင်တာနက်မရှိဘဲ ဆက်သုံးနိုင်ပါသည်။", "reply": "သင့်သီးသန့်ပြန်စာ", "noUrgent": "ဤဝန်ဆောင်မှုကို အဆက်မပြတ် စောင့်ကြည့်နေခြင်း မရှိပါ။ အရေးပေါ်အကူအညီလိုအပ်ပါက အကူအညီပေးသော ဝန်ဆောင်မှုကို တိုက်ရိုက် အသုံးပြုပါ။"}};let activeLocale='my';const records=new Map();const now=()=>new Date().toISOString();const mockFetch=async(url,options)=>{const b=JSON.parse(options.body);let r=records.get(b.receipt);if(b.action==='submit'){if(!r){r={ok:true,status:'received',submittedAt:now(),expiresAt:new Date(Date.now()+14*86400000).toISOString()};records.set(b.receipt,r)}return{status:200,json:async()=>r}}if(b.action==='withdraw'&&r){r={ok:true,status:'withdrawn'};records.set(b.receipt,r)}return{status:r?200:404,json:async()=>r||{ok:false,status:'not_found'}}};const panel=LiftCommunityIntakeUI.mount(document.getElementById('intake'),{copy:copies.my,locale:'my',enabled:true,draft:()=>({kind:'question',topic:'family',text:'Fictional family learning question',language:activeLocale}),clientFactory:()=>LiftCommunityIntakeClient.createClient({fetchImpl:mockFetch})});document.getElementById('language').addEventListener('change',e=>{activeLocale=e.target.value;document.documentElement.lang=activeLocale;panel.setLanguage(copies[activeLocale],activeLocale)});</script></html>
