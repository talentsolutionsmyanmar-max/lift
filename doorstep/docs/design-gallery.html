   not kept · ≈ = calculated · lock = not open yet.
   Dependency-free: CSS custom properties + inline SVG only.
   ========================================================================== */

/* ---------- 2. Primitive ramps -------------------------------------------- */
.lift{
  /* Leaf — principal green. Hue ~152°: a living leaf, not olive, not flag-emerald. */
  --leaf-50:#EEF6F1; --leaf-100:#D7EBDF; --leaf-200:#AFD6BF; --leaf-300:#7FBE9B;
  --leaf-400:#4FA277; --leaf-500:#2B8458; --leaf-600:#1A6B4A; --leaf-700:#15573C;
  --leaf-800:#10432F; --leaf-900:#0B3022; --leaf-950:#071E15;
  /* Sill — first light. Analogous to leaf (yellow sits next to green on the wheel).
     300–400 are LIGHT ONLY (lines, glows); 600–700 are the text-safe ambers. */
  --sill-100:#FFF6E0; --sill-200:#FBE6B0; --sill-300:#F4CF73; --sill-400:#E8B44A;
  --sill-600:#8A5A00; --sill-700:#6E4700;
  /* Stone — neutrals tinted 1–3% toward leaf so every grey belongs to the brand. */
  --stone-0:#FFFFFF; --stone-50:#F4F6F2; --stone-100:#EEF1EC; --stone-200:#DCE2DA;
  --stone-300:#B9C3B8; --stone-500:#5F6D64; --stone-600:#4A5A50; --stone-900:#12231A;
  /* Mark — the complement of leaf. Used ONLY for the dot on the ı (≈0.1% of pixels). */
  --mark:#D0342C;
  --red-700:#B3261E; --red-50:#FBEAE8; --blue-700:#2C5D8A; --blue-50:#EAF1F8;

  /* ---------- 3. Semantic roles (light) ---------- */
  --bg:var(--stone-50); --surface:var(--stone-0); --surface-2:var(--stone-100);
  --line:var(--stone-200); --line-strong:var(--stone-300);
  --text:var(--stone-900); --text-2:var(--stone-600); --text-3:var(--stone-500);
  --action:var(--leaf-600); --action-press:var(--leaf-700); --on-action:#FFFFFF;
  --action-tint:var(--leaf-50); --action-tint-2:var(--leaf-100);
  --sill:var(--sill-400); --sill-soft:var(--sill-200); --sill-glow:rgba(232,180,74,.35);
  --focus:var(--leaf-600);
  /* status set — never colour alone: every status carries an icon + words */
  --st-kept:var(--leaf-700);   --st-kept-bg:var(--leaf-50);
  --st-draft:var(--stone-600); --st-draft-bg:var(--stone-100);
  --st-calc:var(--blue-700);   --st-calc-bg:var(--blue-50);
  --st-warn:var(--sill-700);   --st-warn-bg:var(--sill-100);
  --st-error:var(--red-700);   --st-error-bg:var(--red-50);
  --st-closed:var(--stone-600);--st-closed-bg:var(--stone-100);

  /* ---------- 4. Type ---------- */
  --font:"Lift Padauk",system-ui,-apple-system,"Roboto","Segoe UI","Noto Sans","Noto Sans Myanmar","Myanmar Text",sans-serif;
  --t-display:calc(28*var(--u));  --lh-display:1.2;
  --t-h1:calc(24*var(--u));        --lh-h1:1.25;
  --t-h2:calc(19*var(--u));     --lh-h2:1.3;
  --t-body:calc(17*var(--u));   --lh-body:1.5;
  --t-label:calc(16*var(--u));       --lh-label:1.35;
  --t-help:calc(14*var(--u));     --lh-help:1.45;
  --t-micro:calc(13*var(--u));   --lh-micro:1.3;

  /* ---------- 5. Space, shape, depth, motion ---------- */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px; --s8:32px; --s10:40px;
  --r-control:10px; --r-card:14px; --r-sheet:20px; --r-pill:999px;
  --touch:48px; --bar:56px;
  --lift-1:0 1px 2px rgba(18,35,26,.06);
  --lift-card:0 1px 2px rgba(18,35,26,.06),0 8px 24px -10px rgba(18,35,26,.18);
  --m-quick:120ms; --m-base:200ms; --m-calm:320ms; --ease:cubic-bezier(.2,.7,.2,1);

  --u:1px;
  color-scheme:light;
  font-family:var(--font); font-size:var(--t-body); line-height:var(--lh-body);
  color:var(--text); background:var(--bg);
  -webkit-text-size-adjust:100%;
}

/* ---------- 6. Dark — re-derived, not inverted: a dark room, light under the door ---------- */
.lift[data-theme="dark"]{
  --bg:#0E1712; --surface:#16211A; --surface-2:#1D2A22;
  --line:#2A3A30; --line-strong:#3B4D41;
  --text:#E6EEE8; --text-2:#A8B8AE; --text-3:#8FA197;
  --action:#5CC08A; --action-press:#7FD1A3; --on-action:#0B1A12;
  --action-tint:#14291E; --action-tint-2:#1A3526;
  --sill:#E8C66A; --sill-soft:#3A3018; --sill-glow:rgba(232,198,106,.30);
  --focus:#7FD1A3;
  --st-kept:#8FD3AC; --st-kept-bg:#14291E;
  --st-draft:#B5C2BA; --st-draft-bg:#1D2A22;
  --st-calc:#9EC3E6;  --st-calc-bg:#16222F;
  --st-warn:#E8C66A;  --st-warn-bg:#2A2412;
  --st-error:#F0A097; --st-error-bg:#2E1715;
  --st-closed:#B5C2BA;--st-closed-bg:#1D2A22;
  --mark:#E5574E;
  --lift-1:none; --lift-card:0 10px 28px -12px rgba(0,0,0,.7);
  color-scheme:dark;
}

/* ---------- 7. Myanmar & enlarged text ---------- */
.lift:lang(my){
  --t-display:calc(25*var(--u)); --lh-display:1.65;
  --t-h1:calc(22*var(--u));       --lh-h1:1.7;
  --t-h2:calc(18*var(--u));       --lh-h2:1.75;
  --t-body:calc(16*var(--u));         --lh-body:1.85;
  --t-label:calc(16*var(--u));        --lh-label:1.8;
  --t-help:calc(14*var(--u));      --lh-help:1.8;
  --t-micro:calc(13*var(--u));    --lh-micro:1.6;
}
/* Myanmar has no case, no italic, and stacked marks: never letter-space, never transform,
   never break inside a syllable cluster. Lines break at ICU word boundaries + CCO-placed ZWSP. */
.lift:lang(my) *{letter-spacing:0!important;text-transform:none!important;font-style:normal!important}
.lift *{overflow-wrap:break-word;word-break:normal}
/* A+ : one switch scales every rem token by 125%; layouts are built to reflow, not shrink. */
.lift.is-large{--u:1.25px} /* production: html.is-large on the root */

/* ---------- 8. Base ---------- */
.lift *,.lift *::before,.lift *::after{box-sizing:border-box}
.lift h1,.lift h2,.lift h3,.lift p{margin:0}
.lift h1{font-size:var(--t-h1);line-height:var(--lh-h1);font-weight:700;letter-spacing:-.01em}
.lift h2{font-size:var(--t-h2);line-height:var(--lh-h2);font-weight:700}
.lift .display{font-size:var(--t-display);line-height:var(--lh-display);font-weight:700;letter-spacing:-.015em}
.lift .lede{color:var(--text-2)}
.lift .help{font-size:var(--t-help);line-height:var(--lh-help);color:var(--text-2)}
.lift .micro{font-size:var(--t-micro);line-height:var(--lh-micro)}
.lift .num{font-variant-numeric:tabular-nums lining-nums}
.lift button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.lift :focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.lift .ic{width:24px;height:24px;flex:none;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.lift .ic.sm{width:20px;height:20px}
@media (prefers-reduced-motion:reduce){.lift *{animation:none!important;transition:none!important}}

/* ---------- 9. App header + the sill ---------- */
.hdr{display:flex;align-items:center;gap:var(--s2);padding:var(--s2) var(--s3) var(--s2) var(--s4);background:var(--surface);min-height:60px}
.hdr .wm{height:30px;width:auto;color:var(--text);display:block}
.hdr .sp{flex:1}
.tool{min-width:var(--touch);height:var(--touch);display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 10px;border-radius:var(--r-control);color:var(--text-2);font-size:var(--t-micro);font-weight:700}
.tool[aria-pressed="true"]{background:var(--action-tint-2);color:var(--action)}
.sill{position:relative;height:3px;background:var(--line)}
.sill::before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent 0%,var(--sill) 18%,var(--sill) 82%,transparent 100%)}
.sill::after{content:"";position:absolute;left:10%;right:10%;top:3px;height:14px;background:radial-gradient(60% 100% at 50% 0%,var(--sill-glow),transparent 75%);pointer-events:none}
/* progress variant: the light grows across the threshold */
.sill.progress::before{right:auto;width:var(--p,0%);background:linear-gradient(90deg,var(--sill) 0%,var(--sill) 85%,color-mix(in srgb,var(--sill) 40%,transparent))}
.sill.progress::after{left:0;right:auto;width:var(--p,0%)}

/* ---------- 10. Bottom navigation (3 destinations) ---------- */
.nav{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border-top:1px solid var(--line);padding:6px 8px 8px}
.nav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:var(--bar);border-radius:var(--r-control);color:var(--text-2);text-decoration:none;font-size:var(--t-micro);line-height:var(--lh-micro);font-weight:600;text-align:center;padding:4px}
.nav a[aria-current="page"]{color:var(--action);font-weight:700}
.nav a[aria-current="page"] .ic{stroke-width:2.25}
.nav a[aria-current="page"]::after{content:"";width:20px;height:3px;border-radius:2px;background:var(--sill);margin-top:2px}

/* ---------- 11. Page ---------- */
.lift>main{flex:1}
.page{padding:var(--s5) var(--s4) var(--s6)}
.ph{margin-bottom:var(--s5)}
.ph h1+p{margin-top:var(--s2)}
.crumb{display:inline-flex;align-items:center;gap:6px;min-height:var(--touch);margin:-8px 0 var(--s1) -6px;padding:0 6px;color:var(--action);font-weight:600;font-size:var(--t-label);text-decoration:none}
.eyebrow{font-size:var(--t-micro);line-height:var(--lh-micro);font-weight:700;color:var(--sill-600);letter-spacing:.02em}
.lift[data-theme="dark"] .eyebrow{color:var(--sill)}
.stack{display:flex;flex-direction:column;gap:var(--s3)}
.sec-t{font-size:var(--t-label);font-weight:700;margin:var(--s8) 0 var(--s3)}

/* ---------- 12. Buttons ---------- */
.btn{display:flex;align-items:center;justify-content:center;gap:var(--s2);width:100%;min-height:var(--bar);padding:10px 18px;border-radius:var(--r-control);font-size:var(--t-label);line-height:var(--lh-label);font-weight:700;text-align:center;text-decoration:none;transition:background var(--m-quick) var(--ease),transform var(--m-quick) var(--ease)}
.btn.primary{background:var(--action);color:var(--on-action)}
.btn.primary:active{background:var(--action-press);transform:scale(.99)}
.btn.secondary{background:var(--surface);color:var(--action);box-shadow:inset 0 0 0 1.5px var(--line-strong)}
.btn.text{min-height:var(--touch);color:var(--action);text-decoration:underline;text-underline-offset:4px;font-weight:600}
.btn[disabled]{background:var(--surface-2);color:var(--text-3);box-shadow:none}
.row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:var(--s3)}

/* ---------- 13. Start card (home hero) — the card you will make, shown before you begin ---------- */
.start{position:relative;background:var(--surface);border-radius:var(--r-card);box-shadow:var(--lift-card);padding:var(--s5) var(--s5) var(--s5);overflow:hidden}
.start::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:linear-gradient(90deg,transparent,var(--sill) 15%,var(--sill) 85%,transparent)}
.start h2{font-size:var(--t-display);line-height:var(--lh-display);margin:var(--s2) 0 var(--s2)}
.start .ghost{margin:var(--s4) 0 var(--s5);border:1.5px dashed var(--line-strong);border-radius:var(--r-control);padding:var(--s3) var(--s4);background:var(--surface-2)}
.ghost .gl{display:flex;align-items:center;gap:10px;height:22px}
.ghost .gl i{flex:none;width:18px;font-style:normal;font-size:var(--t-micro);color:var(--text-3);font-weight:700}
.ghost .gl b{height:8px;border-radius:4px;background:var(--line);flex:1}
.ghost .gl:nth-child(3) b{flex:.62}.ghost .gl:nth-child(4) b{flex:.8}
.ghost .gcap{font-size:var(--t-micro);line-height:var(--lh-micro);color:var(--text-2);font-weight:700;margin-bottom:6px;display:flex;gap:6px;align-items:center}

/* ---------- 14. Task entry ---------- */
.task{display:flex;align-items:center;gap:var(--s4);min-height:72px;padding:var(--s3) var(--s3) var(--s3) var(--s4);background:var(--surface);border-radius:var(--r-card);box-shadow:inset 0 0 0 1px var(--line);text-decoration:none;color:var(--text)}
.task .tile{width:44px;height:44px;border-radius:12px;background:var(--action-tint);color:var(--action);display:flex;align-items:center;justify-content:center;flex:none}
.task .tt{flex:1;min-width:0}
.task .tt b{display:block;font-size:var(--t-label);line-height:var(--lh-label)}
.task .tt span{display:block;font-size:var(--t-help);line-height:var(--lh-help);color:var(--text-2);margin-top:2px}
.task .chev{color:var(--text-3)}

/* ---------- 15. Activity intro facts (stacked, never a right-aligned table) ---------- */
.facts{display:flex;flex-direction:column;gap:var(--s3);margin:var(--s5) 0}
.fact{display:grid;grid-template-columns:32px 1fr;gap:var(--s3);align-items:start}
.fact .fi{width:32px;height:32px;border-radius:9px;background:var(--surface-2);color:var(--text-2);display:flex;align-items:center;justify-content:center}
.fact .fi .ic{width:18px;height:18px}
.fact .k{font-size:var(--t-micro);line-height:var(--lh-micro);color:var(--text-2);font-weight:700}
.fact .v{font-size:var(--t-label);line-height:var(--lh-label);font-weight:600}

/* ---------- 16. Question group + options ---------- */
.stepmeta{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);margin-bottom:var(--s3)}
.stepmeta .count{font-size:var(--t-micro);line-height:var(--lh-micro);color:var(--text-2);font-weight:700}
.why{display:flex;gap:var(--s3);align-items:flex-start;margin:var(--s3) 0 var(--s4);padding:var(--s3) var(--s4);background:var(--action-tint);border-radius:var(--r-control);font-size:var(--t-help);line-height:var(--lh-help);color:var(--text)}
.why b{display:block;color:var(--action);font-size:var(--t-micro)}
.why .ic{color:var(--action);margin-top:2px;width:20px;height:20px}
.opt{position:relative;display:grid;grid-template-columns:24px 1fr;gap:var(--s3);align-items:start;min-height:var(--bar);padding:14px var(--s4);background:var(--surface);border-radius:var(--r-control);box-shadow:inset 0 0 0 1.5px var(--line);cursor:pointer}
.opt .bx{width:24px;height:24px;border-radius:7px;box-shadow:inset 0 0 0 2px var(--line-strong);display:flex;align-items:center;justify-content:center;margin-top:1px;color:var(--on-action)}
.opt.radio .bx{border-radius:50%}
.opt .ol{font-size:var(--t-label);line-height:var(--lh-label);font-weight:600}
.opt .ow{display:block;font-size:var(--t-help);line-height:var(--lh-help);color:var(--text-2);font-weight:400;margin-top:3px}
.opt.on{box-shadow:inset 0 0 0 2px var(--action);background:var(--action-tint)}
.opt.on .bx{background:var(--action);box-shadow:none}
.opt.soft{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line);border-style:dashed}
.opt.soft{box-shadow:none;outline:1.5px dashed var(--line-strong);outline-offset:-1.5px}
.skipline{display:flex;justify-content:space-between;align-items:center;margin-top:var(--s2)}

/* ---------- 17. Card tray + sticky action bar ---------- */
.dock{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:var(--s3) var(--s4) var(--s4)}
.tray{display:flex;align-items:center;gap:var(--s3);padding:10px var(--s3);margin-bottom:var(--s3);border-radius:var(--r-control);background:var(--surface-2);position:relative;overflow:hidden}
.tray .tn{flex:none;min-width:36px;height:36px;border-radius:9px;background:var(--surface);box-shadow:inset 0 -3px 0 var(--sill);display:flex;align-items:center;justify-content:center;font-weight:700}
.tray .tt{flex:1;min-width:0;font-size:var(--t-help);line-height:var(--lh-help)}
.tray .tt b{display:block;font-size:var(--t-micro);color:var(--text-2)}
.tray .tt span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tray.writing .tt span{animation:writein var(--m-calm) var(--ease) both}
.tray.writing .tn{animation:sillpulse 600ms var(--ease) both}
@keyframes writein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes sillpulse{0%{box-shadow:inset 0 -3px 0 var(--sill),0 0 0 0 var(--sill-glow)}50%{box-shadow:inset 0 -3px 0 var(--sill),0 0 0 6px var(--sill-glow)}100%{box-shadow:inset 0 -3px 0 var(--sill),0 0 0 0 transparent}}

/* ---------- 18. The carry card (result object) ---------- */
.qcard{position:relative;background:var(--surface);border-radius:var(--r-card);box-shadow:var(--lift-card);padding:var(--s5) var(--s5) calc(var(--s5) + 4px);margin-bottom:var(--s6)}
.qcard::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;border-radius:0 0 var(--r-card) var(--r-card);background:var(--sill)}
.qcard::before{content:"";position:absolute;left:8%;right:8%;bottom:-16px;height:16px;background:radial-gradient(50% 100% at 50% 0%,var(--sill-glow),transparent 80%)}
.qcard.is-draft{box-shadow:none;outline:1.5px dashed var(--line-strong);outline-offset:-1.5px;background:var(--surface)}
.qcard.is-draft::after,.qcard.is-draft::before{display:none}
/* made but not kept: the light under the door is broken (dashed), no glow */
.qcard.unkept::after{background:repeating-linear-gradient(90deg,var(--line-strong) 0 10px,transparent 10px 16px)}
.qcard.unkept::before{display:none}
.qcard .qh{display:flex;justify-content:space-between;align-items:flex-start;gap:var(--s3);margin-bottom:var(--s3)}
.qcard h2{font-size:var(--t-h2)}
.qcard ol{margin:0;padding:0;list-style:none;counter-reset:q}
.qcard li{counter-increment:q;display:grid;grid-template-columns:28px 1fr;gap:var(--s2);padding:var(--s3) 0;border-top:1px solid var(--line);font-size:var(--t-body);line-height:var(--lh-body);font-weight:500}
.qcard li::before{content:counter(q);font-weight:700;color:var(--action);font-variant-numeric:tabular-nums}
.qcard .meta{display:flex;flex-wrap:wrap;gap:var(--s2);align-items:center;margin-top:var(--s3)}

/* ---------- 19. Status labels (persistence + provenance) ---------- */
.state{display:inline-flex;align-items:center;gap:6px;min-height:28px;padding:3px 10px 3px 8px;border-radius:var(--r-pill);font-size:var(--t-micro);line-height:var(--lh-micro);font-weight:700}
.state .ic{width:16px;height:16px;stroke-width:2}
.state.kept{color:var(--st-kept);background:var(--st-kept-bg)}
.state.draft{color:var(--st-draft);background:transparent;box-shadow:inset 0 0 0 1.5px var(--line-strong);background-image:none;outline:none}
.state.draft{box-shadow:none;border:1.5px dashed var(--line-strong)}
.state.calc{color:var(--st-calc);background:var(--st-calc-bg)}
.state.closed{color:var(--st-closed);background:var(--st-closed-bg)}
.state.warn{color:var(--st-warn);background:var(--st-warn-bg)}

/* ---------- 20. Meaning / uncertainty / next action ---------- */
.mean{display:grid;grid-template-columns:32px 1fr;gap:var(--s3);margin-bottom:var(--s4)}
.mean .fi{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;background:var(--surface-2);color:var(--text-2)}
.mean .fi .ic{width:18px;height:18px}
.mean b{display:block;font-size:var(--t-micro);line-height:var(--lh-micro);color:var(--text-2)}
.mean p{font-size:var(--t-label);line-height:var(--lh-label)}
.next{margin:var(--s5) 0 var(--s4);padding:var(--s4);border-radius:var(--r-card);background:var(--action-tint);box-shadow:inset 3px 0 0 var(--action)}
.next .eyebrow{color:var(--action)}
.next b{display:block;font-size:var(--t-h2);line-height:var(--lh-h2);margin:2px 0 2px}
.next p{font-size:var(--t-help);line-height:var(--lh-help);color:var(--text-2);margin-bottom:var(--s3)}

/* ---------- 21. Notices ---------- */
.note{display:grid;grid-template-columns:22px 1fr;gap:var(--s3);align-items:start;padding:var(--s3) var(--s4);border-radius:var(--r-control);font-size:var(--t-help);line-height:var(--lh-help)}
.note .ic{width:20px;height:20px;margin-top:1px}
.note.info{background:var(--surface-2);color:var(--text-2)}
.note.closed{background:var(--st-closed-bg);color:var(--text)}
.note.closed b{display:block;font-size:var(--t-label)}
.note.warn{background:var(--st-warn-bg);color:var(--st-warn)}
.note.error{background:var(--st-error-bg);color:var(--st-error)}
.note.offline{background:var(--surface-2);color:var(--text);border:1.5px dashed var(--line-strong)}

/* ---------- 22. Mine record ---------- */
.rec{position:relative;background:var(--surface);border-radius:var(--r-card);padding:var(--s4) var(--s4) calc(var(--s4) + 4px);box-shadow:inset 0 0 0 1px var(--line);overflow:hidden}
.rec::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:repeating-linear-gradient(90deg,var(--line-strong) 0 10px,transparent 10px 16px)}
.rec.kept::after{background:var(--sill)}
.rec .rh{display:flex;justify-content:space-between;gap:var(--s3);align-items:flex-start}
.rec .rh b{font-size:var(--t-label);line-height:var(--lh-label)}
.rec .date{font-size:var(--t-micro);color:var(--text-2);white-space:nowrap}
.rec dl{margin:var(--s3) 0 0;display:grid;gap:var(--s3)}
.rec dt{font-size:var(--t-micro);line-height:var(--lh-micro);color:var(--text-2);font-weight:700}
.rec dd{margin:2px 0 0;font-size:var(--t-help);line-height:var(--lh-help)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.chip{display:inline-flex;align-items:center;min-height:28px;padding:2px 10px;border-radius:var(--r-pill);background:var(--surface-2);font-size:var(--t-micro);line-height:var(--lh-micro);font-weight:600}
.todo{display:flex;align-items:center;gap:var(--s3);padding:var(--s3) var(--s3) var(--s3) var(--s4);background:var(--surface);border-radius:var(--r-card);box-shadow:inset 3px 0 0 var(--action),inset 0 0 0 1px var(--line)}
.todo .tt{flex:1}
.todo .tt b{display:block;font-size:var(--t-label);line-height:var(--lh-label)}
.todo .tt span{font-size:var(--t-help);color:var(--text-2)}
.todo .go{text-decoration:none;min-height:var(--touch);padding:0 14px;border-radius:var(--r-control);color:var(--action);font-weight:700;box-shadow:inset 0 0 0 1.5px var(--line-strong);display:flex;align-items:center}

/* ---------- 23. External handoff ---------- */
.ext{display:flex;align-items:center;gap:var(--s3);min-height:64px;padding:var(--s3) var(--s4);border-radius:var(--r-control);background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);color:var(--text);text-decoration:none}
.ext .tt{flex:1}
.ext .tt b{display:block;font-size:var(--t-label);line-height:var(--lh-label)}
.ext .tt span{display:flex;gap:6px;align-items:center;font-size:var(--t-micro);line-height:var(--lh-micro);color:var(--text-2);margin-top:2px}

/* ---------- 24. Bottom sheet ---------- */
.scrim{position:absolute;inset:0;background:rgba(7,20,13,.55);display:flex;align-items:flex-end}
.sheet{width:100%;background:var(--surface);border-radius:var(--r-sheet) var(--r-sheet) 0 0;padding:var(--s3) var(--s4) var(--s5)}
.sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line-strong);margin:0 auto var(--s4)}
.sheet h2{margin-bottom:var(--s3)}

/* ---------- 25. Show-large mode ---------- */
.show{min-height:100%;background:var(--surface);padding:var(--s5) var(--s5);display:flex;flex-direction:column}
.show ol{list-style:none;margin:0;padding:0;counter-reset:q;flex:1}
.show li{counter-increment:q;font-size:calc(24*var(--u));line-height:1.35;font-weight:700;padding:var(--s4) 0;border-bottom:2px solid var(--line);display:grid;grid-template-columns:36px 1fr}
.show li::before{content:counter(q);color:var(--action)}
.lift:lang(my) .show li{font-size:calc(22*var(--u));line-height:1.75}

/* ---------- 26. Copy-provenance marker (mockups only) ---------- */
.cco{background:repeating-linear-gradient(135deg,transparent 0 6px,rgba(232,180,74,.16) 6px 12px);outline:1.5px dashed #C89220;outline-offset:1px;border-radius:3px}
.cco::before{content:"CCO · ";font-size:.7em;font-weight:800;color:#8A5A00;letter-spacing:.04em}
.unv{text-decoration:underline dotted rgba(120,135,126,.55);text-underline-offset:6px;text-decoration-thickness:1px}

/* ---------- 27. Fields, dropdown, helper ---------- */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:var(--t-label);line-height:var(--lh-label);font-weight:700}
.control{width:100%;min-height:var(--bar);padding:12px 14px;border-radius:var(--r-control);border:0;box-shadow:inset 0 0 0 1.5px var(--line-strong);background:var(--surface);color:var(--text);font:inherit;font-size:calc(17*var(--u))}
.control:focus{outline:none;box-shadow:inset 0 0 0 2px var(--action),0 0 0 4px var(--action-tint-2)}
.control.money{font-variant-numeric:tabular-nums;text-align:right}
.affix{position:relative}.affix .pre{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text-2);font-weight:700}
.affix .control{padding-left:34px}
select.control{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--text-2) 50%),linear-gradient(135deg,var(--text-2) 50%,transparent 50%);background-position:calc(100% - 20px) 50%,calc(100% - 14px) 50%;background-size:6px 6px;background-repeat:no-repeat;padding-right:40px}
.control[aria-invalid="true"]{box-shadow:inset 0 0 0 2px var(--st-error)}
.err{display:flex;gap:6px;align-items:flex-start;font-size:var(--t-help);line-height:var(--lh-help);color:var(--st-error);font-weight:600}
.err .ic{width:18px;height:18px;margin-top:2px}

/* ---------- 28. Empty state ---------- */
.empty{text-align:center;padding:var(--s8) var(--s4)}
.empty .doorway{width:52px;height:72px;margin:0 auto var(--s4);border-radius:4px;box-shadow:inset 0 0 0 2px var(--line-strong);position:relative}
.empty .doorway::before{content:"";position:absolute;left:8px;top:8px;bottom:0;width:22px;border-radius:2px;background:var(--action-tint-2);transform:skewY(-8deg);transform-origin:left bottom}
.empty .doorway::after{content:"";position:absolute;left:-10px;right:-10px;bottom:-2px;height:3px;border-radius:2px;background:var(--sill)}
.empty h2{margin-bottom:6px}.empty p{color:var(--text-2);margin:0 auto var(--s4);max-width:30ch}

/* ---------- 29. Timeline (days ahead) — a list, never a decorative chart ---------- */
.tl{list-style:none;margin:0;padding:0}
.tl li{display:grid;grid-template-columns:84px 1fr auto;gap:var(--s3);align-items:center;min-height:52px;padding:8px 0;border-top:1px solid var(--line)}
.tl .d{font-size:var(--t-help);color:var(--text-2);font-weight:600}
.tl .e{font-size:var(--t-help);line-height:var(--lh-help)}
.tl .v{font-variant-numeric:tabular-nums;font-weight:700;text-align:right;white-space:nowrap}
.tl li.short .v{color:var(--st-warn)}
.tl li.short{box-shadow:inset 3px 0 0 var(--sill);padding-left:10px}

/* ---------- 30. Receipt / status panel ---------- */
.receipt{border-radius:var(--r-card);padding:var(--s4);background:var(--surface);box-shadow:inset 0 0 0 1px var(--line)}
.receipt dl{margin:var(--s3) 0 0;display:grid;grid-template-columns:auto 1fr;gap:8px 16px;font-size:var(--t-help)}
.receipt dt{color:var(--text-2)}.receipt dd{margin:0;font-weight:600}

body{margin:0;background:#888;padding:20px;display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}

function header(o){
  return `<header class="hdr">${WM}<span class="sp"></span>
   <button class="tool" aria-pressed="${!!o.large}" aria-label="${plain('a11y.largerText')}">A+</button>
   <button class="tool" aria-label="theme">${ic(o.dark?'moon':'sun','sm')}</button>
   <button class="tool" aria-label="language">${ic('globe','sm')}<span>${LANG==='my'?'EN':'မြန်မာ'}</span></button>
  </header>`;
}
function sill(p){return p===undefined?'<div class="sill"></div>':`<div class="sill progress" style="--p:${p}%"></div>`;}
function nav(cur){
  const items=[['home','home'],['community','community'],['mine','mine']];

}
function crumb(label){return `<a class="crumb" href="#">${ic('back','sm')}${label}</a>`;}
function opt(kind,on,label,why){return `<label class="opt ${kind} ${on?'on':''}"><span class="bx">${on?ic('check','sm'):''}</span><span class="ol">${label}${why?`<span class="ow">${why}</span>`:''}</span></label>`;}
