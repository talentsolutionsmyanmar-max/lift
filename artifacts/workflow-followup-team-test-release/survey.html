</script><script>(()=>{'use strict';let lang='my',count=0,id=crypto.randomUUID(),locked=false;const form=document.querySelector('#survey'),status=document.querySelector('#status'),copy=window.SURVEY_COPY;const t=k=>(copy[lang]||copy.en)[k]||copy.en[k];const names=['role','recent','source','trust','agent','threeMonths','format','language'];const topicKeys=['documents','agents','work','housing','health','family','money','transport','community','other'];const fields=document.querySelector('#fields');for(const name of names){const label=document.createElement('label'),span=document.createElement('span');span.dataset.t=name;label.append(span);let input;if(name==='role'||name==='format'){input=document.createElement('select');const opts=name==='role'?['choose','role1','role2','role3','role4']:['choose','text','audio','pictures','mixed'];for(const key of opts){const option=document.createElement('option');option.value=key==='choose'?'':key;option.dataset.t=key;input.append(option)}}else{input=document.createElement('textarea');input.rows=3;input.maxLength=1500}input.name=name;label.append(input);fields.append(label);if(name==='recent'){const group=document.createElement('fieldset'),legend=document.createElement('legend');legend.dataset.t='topics';group.append(legend);for(const key of topicKeys){const l=document.createElement('label');l.className='choice';const c=document.createElement('input');c.type='checkbox';c.name='topics';c.value=key;const s=document.createElement('span');s.dataset.t=key;l.append(c,s);group.append(l)}fields.append(group)}}const choiceCopy=window.LiftChoiceCopy;const svg='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M5 4h14a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-7l-5 4v-4H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Z"/><path d="m8 11 3 3 5-6"/></svg>';form.querySelectorAll('#fields label>span,#fields legend').forEach(el=>{const visual=document.createElement('span');visual.innerHTML=svg;visual.className='question-icon';el.before(visual)});
